<svg
  width="1200"
  height="140"
  viewBox="0 0 1200 140"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>

    <!-- Top wave gradient -->
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8">
        <animate
          attributeName="stop-color"
          values="#38BDF8;#818CF8;#A855F7;#38BDF8"
          dur="6s"
          repeatCount="indefinite"
        />
      </stop>

      <stop offset="50%" stop-color="#A855F7">
        <animate
          attributeName="stop-color"
          values="#A855F7;#38BDF8;#F472B6;#A855F7"
          dur="6s"
          repeatCount="indefinite"
        />
      </stop>

      <stop offset="100%" stop-color="#22D3EE">
        <animate
          attributeName="stop-color"
          values="#22D3EE;#A855F7;#38BDF8;#22D3EE"
          dur="6s"
          repeatCount="indefinite"
        />
      </stop>
    </linearGradient>

    <!-- Bottom wave gradient -->
    <linearGradient id="wave2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F472B6">
        <animate
          attributeName="stop-color"
          values="#F472B6;#818CF8;#38BDF8;#F472B6"
          dur="8s"
          repeatCount="indefinite"
        />
      </stop>

      <stop offset="50%" stop-color="#818CF8">
        <animate
          attributeName="stop-color"
          values="#818CF8;#38BDF8;#A855F7;#818CF8"
          dur="8s"
          repeatCount="indefinite"
        />
      </stop>

      <stop offset="100%" stop-color="#38BDF8">
        <animate
          attributeName="stop-color"
          values="#38BDF8;#A855F7;#F472B6;#38BDF8"
          dur="8s"
          repeatCount="indefinite"
        />
      </stop>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- First wave -->
  <path
    d="M0 65
       C150 10 250 110 400 60
       C550 10 650 110 800 60
       C950 10 1050 110 1200 55
       L1200 140
       L0 140 Z"
    fill="url(#wave1)"
    opacity="0.22"
  >
    <animate
      attributeName="d"
      dur="7s"
      repeatCount="indefinite"
      values="
      M0 65 C150 10 250 110 400 60 C550 10 650 110 800 60 C950 10 1050 110 1200 55 L1200 140 L0 140 Z;
      M0 55 C150 105 250 5 400 65 C550 115 650 5 800 65 C950 115 1050 5 1200 65 L1200 140 L0 140 Z;
      M0 65 C150 10 250 110 400 60 C550 10 650 110 800 60 C950 10 1050 110 1200 55 L1200 140 L0 140 Z
      "
    />
  </path>

  <!-- Second wave -->
  <path
    d="M0 90
       C150 40 250 130 400 85
       C550 40 650 130 800 85
       C950 40 1050 130 1200 80
       L1200 140
       L0 140 Z"
    fill="url(#wave2)"
    opacity="0.32"
    filter="url(#glow)"
  >
    <animate
      attributeName="d"
      dur="9s"
      repeatCount="indefinite"
      values="
      M0 90 C150 40 250 130 400 85 C550 40 650 130 800 85 C950 40 1050 130 1200 80 L1200 140 L0 140 Z;
      M0 80 C150 130 250 35 400 90 C550 135 650 35 800 90 C950 135 1050 35 1200 85 L1200 140 L0 140 Z;
      M0 90 C150 40 250 130 400 85 C550 40 650 130 800 85 C950 40 1050 130 1200 80 L1200 140 L0 140 Z
      "
    />
  </path>

  <!-- Floating particles -->
  <circle cx="180" cy="45" r="2" fill="#38BDF8">
    <animate
      attributeName="cy"
      values="45;25;45"
      dur="3s"
      repeatCount="indefinite"
    />
  </circle>

  <circle cx="600" cy="70" r="2" fill="#A855F7">
    <animate
      attributeName="cy"
      values="70;45;70"
      dur="4s"
      repeatCount="indefinite"
    />
  </circle>

  <circle cx="980" cy="40" r="2" fill="#22D3EE">
    <animate
      attributeName="cy"
      values="40;20;40"
      dur="3.5s"
      repeatCount="indefinite"
    />
  </circle>

</svg>
