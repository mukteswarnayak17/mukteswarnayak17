<svg width="1200" height="200" viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Ultra-Bright Neon Gradient 1 -->
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFFF">
        <animate attributeName="stop-color" values="#00FFFF;#FF1493;#39FF14;#FFFF00;#00FFFF" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="25%" stop-color="#FF1493">
        <animate attributeName="stop-color" values="#FF1493;#39FF14;#FFFF00;#00FFFF;#FF1493" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#39FF14">
        <animate attributeName="stop-color" values="#39FF14;#FFFF00;#00FFFF;#FF1493;#39FF14" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="75%" stop-color="#FFFF00">
        <animate attributeName="stop-color" values="#FFFF00;#00FFFF;#FF1493;#39FF14;#FFFF00" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00FFFF">
        <animate attributeName="stop-color" values="#00FFFF;#FF1493;#39FF14;#FFFF00;#00FFFF" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Ultra-Bright Neon Gradient 2 -->
    <linearGradient id="wave2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF4500">
        <animate attributeName="stop-color" values="#FF4500;#8A2BE2;#00FFFF;#FF1493;#FF4500" dur="5.3s" repeatCount="indefinite" />
      </stop>
      <stop offset="25%" stop-color="#8A2BE2">
        <animate attributeName="stop-color" values="#8A2BE2;#00FFFF;#FF1493;#FF4500;#8A2BE2" dur="5.3s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#00FFFF">
        <animate attributeName="stop-color" values="#00FFFF;#FF1493;#FF4500;#8A2BE2;#00FFFF" dur="5.3s" repeatCount="indefinite" />
      </stop>
      <stop offset="75%" stop-color="#FF1493">
         <animate attributeName="stop-color" values="#FF1493;#FF4500;#8A2BE2;#00FFFF;#FF1493" dur="5.3s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#FF4500">
         <animate attributeName="stop-color" values="#FF4500;#8A2BE2;#00FFFF;#FF1493;#FF4500" dur="5.3s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Falling Animations (Placed behind the waves) -->
  
  <!-- Falling Stars -->
  <polygon fill="#FFFF00" opacity="0.9" points="10,0 13,7 20,7 15,12 17,20 10,15 3,20 5,12 0,7 7,7">
    <animateTransform attributeName="transform" type="translate" values="150,-20; 150,220" dur="3s" repeatCount="indefinite" />
  </polygon>
  <polygon fill="#FFFFFF" opacity="0.7" points="5,0 6.5,3.5 10,3.5 7.5,6 8.5,10 5,7.5 1.5,10 2.5,6 0,3.5 3.5,3.5">
    <animateTransform attributeName="transform" type="translate" values="400,-20; 400,220" dur="4s" repeatCount="indefinite" />
  </polygon>
  <polygon fill="#00FFFF" opacity="0.8" points="10,0 13,7 20,7 15,12 17,20 10,15 3,20 5,12 0,7 7,7">
    <animateTransform attributeName="transform" type="translate" values="850,-20; 850,220" dur="2.5s" repeatCount="indefinite" />
  </polygon>
  <polygon fill="#FF1493" opacity="0.9" points="5,0 6.5,3.5 10,3.5 7.5,6 8.5,10 5,7.5 1.5,10 2.5,6 0,3.5 3.5,3.5">
    <animateTransform attributeName="transform" type="translate" values="1100,-20; 1100,220" dur="3.5s" repeatCount="indefinite" />
  </polygon>

  <!-- Falling Circles -->
  <circle cx="280" cy="-20" r="3" fill="#39FF14" opacity="0.8">
    <animate attributeName="cy" values="-20;220" dur="2.8s" repeatCount="indefinite" />
  </circle>
  <circle cx="650" cy="-20" r="2" fill="#8A2BE2" opacity="0.9">
    <animate attributeName="cy" values="-20;220" dur="3.2s" repeatCount="indefinite" />
  </circle>
  <circle cx="950" cy="-20" r="4" fill="#FFFFFF" opacity="0.6">
    <animate attributeName="cy" values="-20;220" dur="4.2s" repeatCount="indefinite" />
  </circle>
  <circle cx="80" cy="-20" r="2" fill="#FFFF00" opacity="0.7">
    <animate attributeName="cy" values="-20;220" dur="3.8s" repeatCount="indefinite" />
  </circle>

  <!-- First Wave -->
  <path d="M0 65 C150 10 250 110 400 60 C550 10 650 110 800 60 C950 10 1050 110 1200 55 L1200 200 L0 200 Z" fill="url(#wave1)" opacity="0.45" filter="url(#glow)">
    <animate attributeName="d" dur="4.6s" repeatCount="indefinite"
      values="
        M0 65 C150 10 250 110 400 60 C550 10 650 110 800 60 C950 10 1050 110 1200 55 L1200 200 L0 200 Z;
        M0 55 C150 105 250 5 400 65 C550 115 650 5 800 65 C950 115 1050 5 1200 65 L1200 200 L0 200 Z;
        M0 65 C150 10 250 110 400 60 C550 10 650 110 800 60 C950 10 1050 110 1200 55 L1200 200 L0 200 Z
      " />
  </path>

  <!-- Second Wave -->
  <path d="M0 90 C150 40 250 130 400 85 C550 40 650 130 800 85 C950 40 1050 130 1200 80 L1200 200 L0 200 Z" fill="url(#wave2)" opacity="0.55" filter="url(#glow)">
    <animate attributeName="d" dur="6s" repeatCount="indefinite"
      values="
        M0 90 C150 40 250 130 400 85 C550 40 650 130 800 85 C950 40 1050 130 1200 80 L1200 200 L0 200 Z;
        M0 80 C150 130 250 35 400 90 C550 135 650 35 800 90 C950 135 1050 35 1200 85 L1200 200 L0 200 Z;
        M0 90 C150 40 250 130 400 85 C550 40 650 130 800 85 C950 40 1050 130 1200 80 L1200 200 L0 200 Z
      " />
  </path>
</svg>
