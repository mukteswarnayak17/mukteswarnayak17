name: Update GitHub Statistics

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&hide=prs,issues&theme=tokyonight&hide_border=false&border_color=38BDF8&bg_color=0B1220&title_color=38BDF8&text_color=C9D1D9&icon_color=38BDF8&border_radius=12&card_width=570
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Contribution Streak
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&theme=tokyonight&hide_border=false&background=0B1220&border=38BDF8&stroke=334155&ring=38BDF8&fire=38BDF8&currStreakNum=FFFFFF&sideNums=FFFFFF&currStreakLabel=38BDF8&sideLabels=C9D1D9&dates=94A3B8&border_radius=12&card_width=570&card_height=200&timezone=Asia/Kolkata
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Save Generated Cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update GitHub statistics" || exit 0
          git push
